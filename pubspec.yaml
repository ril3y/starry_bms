name: starry_bms
description: Starry BMS driver (Power Queen / ANT / LiTime) - framed BLE protocol, live data - for bms_core.
version: 0.1.0
publish_to: none
repository: https://github.com/ril3y/starry_bms
topics: [bluetooth, ble, bms, battery]

environment:
  sdk: ^3.13.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  bms_core:
    git:
      url: https://github.com/ril3y/bms_core.git
      ref: main
  universal_ble: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
